<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Murm UI Chat Shell Reference</title>
	</head>
	<body>
		<!--
			Copy this DOM shape into your app and mount ChatUI with:
			new ChatUI({ container: ".mur-app", ... })

			The class names are the integration contract. Button contents,
			icons, labels, and surrounding brand markup are replaceable.
		-->
		<div class="mur-app mur-sidebar-animated">
			<aside class="mur-sidebar">
				<header class="mur-sidebar-header">
					<div class="mur-sidebar-logo">
						<span aria-hidden="true">M</span>
						<span>Murm UI</span>
					</div>

					<button type="button" class="mur-close-sidebar-btn" aria-label="Close sidebar">
						<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="m11 17-5-5 5-5M18 17l-5-5 5-5" />
						</svg>
					</button>
				</header>

				<div class="mur-sidebar-actions">
					<button type="button" class="mur-new-chat-btn mur-sidebar-nav-btn">
						<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M13 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8" />
							<path d="M15.7 5.8a1.2 1.2 0 0 1 1.7 1.7l-6.6 6.6-2.8.8.8-2.8z" />
						</svg>
						<span>New Chat</span>
					</button>
				</div>

				<!-- ChatUI renders saved sessions here. -->
				<div class="mur-sidebar-content">
					<p class="mur-sidebar-status">No past chats.</p>
				</div>

				<!-- SettingsPlugin appends its default settings button here. -->
				<div class="mur-sidebar-footer"></div>
			</aside>

			<main class="mur-main-area">
				<header class="mur-main-header">
					<button type="button" class="mur-open-sidebar-btn" aria-label="Open sidebar">
						<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M3 12h18M3 6h18M3 18h18" />
						</svg>
					</button>

					<!-- Optional. Remove this element if your app does not show an in-app chat title. -->
					<h2 class="mur-header-title">New Chat</h2>
				</header>

				<div class="mur-chat-layout-wrapper">
					<div class="mur-chat-scroll-area">
						<!-- ChatUI renders messages here. -->
						<div class="mur-chat-history" role="log" aria-live="polite" aria-atomic="false"></div>
					</div>

					<div class="mur-chat-form-container">
						<form class="mur-chat-form">
							<textarea class="mur-chat-input" rows="1" placeholder="Message..." aria-label="Message"></textarea>

							<div class="mur-form-footer-right">
								<button type="submit" class="mur-send-btn mur-form-icon-btn mur-action-btn">
									<svg class="mur-send-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"
										fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
										stroke-linejoin="round">
										<path d="M12 19V5" />
										<path d="m5 12 7-7 7 7" />
									</svg>
									<svg class="mur-stop-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"
										fill="currentColor">
										<rect x="4" y="4" width="16" height="16" rx="2" />
									</svg>
								</button>
							</div>
						</form>
					</div>
				</div>
			</main>
		</div>
	</body>
</html>
